

services:

  # ── FastAPI Application ─────────────────────────────────────────────────── #
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acr_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://acr_user:acr_pass@db:5432/acr_db
      - REDIS_URL=redis://redis:6379/0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-gemini}
      - APP_ENV=${APP_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - acr_net

  # ── Celery Worker ───────────────────────────────────────────────────────── #
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acr_worker
    restart: unless-stopped
    command: >
      celery -A app.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=review
    environment:
      - DATABASE_URL=postgresql://acr_user:acr_pass@db:5432/acr_db
      - REDIS_URL=redis://redis:6379/0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-gemini}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - acr_net

  # ── PostgreSQL + pgvector ───────────────────────────────────────────────── #
  db:
    image: ankane/pgvector:latest
    container_name: acr_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     acr_user
      POSTGRES_PASSWORD: acr_pass
      POSTGRES_DB:       acr_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acr_user -d acr_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - acr_net

  # ── Redis (Celery Broker + Result Backend) ──────────────────────────────── #
  redis:
    image: redis:7-alpine
    container_name: acr_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - acr_net

volumes:
  pgdata:
    driver: local

networks:
  acr_net:
    driver: bridge
